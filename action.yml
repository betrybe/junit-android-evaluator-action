name: "JUnit evaluator"
description: "JUnit evaluator for Tryber projects in android"
inputs:
  unit_test:
    description: "Unit test"
    required: false
    default: "true"
  instrumented_test:
    description: "Instrumented_test test"
    required: false
    default: "false"
  pr_author_username:
    description: "Pull Request author username"
    required: true
  skin:
    description: "Screen resolution"
    required: false
    default: "1080x1920"

outputs:
  result:
    description: "JUnit unit tests JSON results in base64 format"
    value: ${{ steps.get_junit_results.outputs.result }}

runs:
  using: "composite"
  steps:
    - name: Set up Nodejs 18
      uses: actions/setup-node@v4
      with:
        node-version: "18"

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: "zulu"
        java-version: "17"

    - name: Gradle cache
      uses: gradle/gradle-build-action@v2

    - name: AVD cache
      uses: actions/cache@v3
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-29-${{ runner.os }}
        restore-keys: avd-29-

    - name: create AVD and generate snapshot for caching
      if: ${{ steps.avd-cache.outputs.cache-hit != 'true' && inputs.instrumented_test == 'true' }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin ${{ inputs.skin }} 
        disable-animations: false
        script: echo "Generated AVD snapshot for caching."

    - name: Run Unit tests
      if: ${{ inputs.unit_test == 'true' }}
      run: ./gradlew test
      shell: bash
      continue-on-error: true

    - name: Enable KVM group perms
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Instrumented tests
      uses: reactivecircus/android-emulator-runner@v2
      if: ${{ inputs.instrumented_test == 'true' }}
      continue-on-error: true
      with:
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin ${{ inputs.skin }} 
        disable-animations: true
        api-level: 29
        # script: ./gradlew connectedCheck
        script: adb shell pm list packages | grep -E 'com\.betrybe|com\.example' | cut -d ':' -f 2 | tr -d '\r' | xargs -L1 -t -r adb uninstall; ./gradlew connectedCheck

    # Quando o app ou o emulador crasha antes de concluir qualquer teste, o relatório
    # XML é gerado sem nenhum <testcase>. Nesse caso (falha de infraestrutura, não do
    # código avaliado) os testes instrumentados são executados mais uma vez.
    - name: Check Instrumented tests results
      id: check_instrumented_results
      if: ${{ inputs.instrumented_test == 'true' }}
      shell: bash
      run: |
        if grep -rlq "<testcase" app/build/outputs/androidTest-results/connected/ 2>/dev/null; then
          echo "has_testcases=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_testcases=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Nenhum <testcase> encontrado nos relatórios dos testes instrumentados (provável crash do app ou do emulador). Executando nova tentativa."
          rm -rf app/build/outputs/androidTest-results/connected
        fi

    - name: Run Instrumented tests (retry)
      uses: reactivecircus/android-emulator-runner@v2
      if: ${{ inputs.instrumented_test == 'true' && steps.check_instrumented_results.outputs.has_testcases == 'false' }}
      continue-on-error: true
      with:
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin ${{ inputs.skin }}
        disable-animations: true
        api-level: 29
        script: adb shell pm list packages | grep -E 'com\.betrybe|com\.example' | cut -d ':' -f 2 | tr -d '\r' | xargs -L1 -t -r adb uninstall; ./gradlew connectedCheck

    - name: Get JUnit results
      id: get_junit_results
      run: node $GITHUB_ACTION_PATH/dist/index.js
      shell: bash
      env:
        INPUT_PR_AUTHOR_USERNAME: ${{inputs.pr_author_username}}
